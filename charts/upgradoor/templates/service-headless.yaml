apiVersion: v1
kind: Service
metadata:
  name: {{ include "upgradoor.fullname" . }}-headless
  # Without the selector labels: the ServiceMonitor scrapes the main Service only.
  labels:
    helm.sh/chart: {{ include "upgradoor.chart" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "upgradoor.selectorLabels" . | nindent 4 }}
