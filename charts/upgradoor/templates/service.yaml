apiVersion: v1
kind: Service
metadata:
  name: {{ include "upgradoor.fullname" . }}
  labels:
    {{- include "upgradoor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  {{- if .Values.extraPorts }}
    {{- toYaml .Values.extraPorts | nindent 4 }}
  {{- end }}
  selector:
    {{- include "upgradoor.selectorLabels" . | nindent 4 }}
{{- if and .Values.ingress.enabled .Values.metrics.blockOnIngress }}
---
# Selects no pod: /metrics on the Ingress answers 503.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "upgradoor.blackholeName" . }}
  labels:
    {{- include "upgradoor.blackholeSelectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "upgradoor.blackholeSelectorLabels" . | nindent 4 }}
{{- end }}
