{{- include "upgradoor.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "upgradoor.fullname" . }}
  labels:
    {{- include "upgradoor.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
spec:
  # One controller per devnet; its state is a SQLite file.
  replicas: 1
  strategy:
    {{- toYaml .Values.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "upgradoor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "upgradoor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "upgradoor.serviceAccountName" . }}
    {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
    {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- toYaml .Values.initContainers | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
          {{- if gt (len .Values.customCommand) 0 }}
            {{- toYaml .Values.customCommand | nindent 12 }}
          {{- else }}
            - /usr/local/bin/upgradoor-controller
          {{- end }}
          args:
            {{- include "upgradoor.args" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: controller-seed
              mountPath: /etc/upgradoor/controller-seed
              readOnly: true
            {{- if include "upgradoor.registryAuthSecretName" . }}
            - name: registry-auth
              mountPath: /etc/upgradoor/registry-auth
              readOnly: true
            {{- end }}
            {{- if .Values.registry.caBundle }}
            - name: registry-ca
              mountPath: /etc/upgradoor/registry-ca
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.httpPort }}
              protocol: TCP
            {{- if .Values.extraPodPorts }}
            {{- toYaml .Values.extraPodPorts | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
          {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
          {{- end }}
        {{- if .Values.extraContainers }}
        {{- toYaml .Values.extraContainers | nindent 8 }}
        {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "upgradoor.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: controller-seed
          secret:
            secretName: {{ include "upgradoor.controllerSeedSecretName" . }}
            defaultMode: 0440
            items:
              - key: seed
                path: seed
        {{- with include "upgradoor.registryAuthSecretName" . }}
        - name: registry-auth
          secret:
            secretName: {{ . }}
            defaultMode: 0440
            items:
              - key: .dockerconfigjson
                path: config.json
        {{- end }}
        {{- if .Values.registry.caBundle }}
        - name: registry-ca
          configMap:
            name: {{ include "upgradoor.fullname" . }}-registry-ca
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
