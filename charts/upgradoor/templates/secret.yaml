{{- if .Values.controllerSeed }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "upgradoor.controllerSeedSecretName" . }}
  labels:
    {{- include "upgradoor.labels" . | nindent 4 }}
type: Opaque
stringData:
  seed: {{ .Values.controllerSeed | quote }}
{{- end }}
{{- if .Values.registry.auth }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "upgradoor.registryAuthSecretName" . }}
  labels:
    {{- include "upgradoor.labels" . | nindent 4 }}
type: Opaque
stringData:
  .dockerconfigjson: {{ .Values.registry.auth | quote }}
{{- end }}
