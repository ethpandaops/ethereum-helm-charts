{{- if and .Values.prometheusRule.enabled .Values.prometheusRule.rules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "upgradoor.fullname" . }}
  {{- if .Values.prometheusRule.namespace }}
  namespace: {{ .Values.prometheusRule.namespace }}
  {{- end }}
  labels:
    {{- include "upgradoor.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "upgradoor.fullname" . }}
      rules:
        {{- /* Only expr is templated; annotations keep Prometheus' own templates. */}}
        {{- range .Values.prometheusRule.rules }}
        {{- $rule := deepCopy . }}
        {{- if hasKey $rule "expr" }}
        {{- $_ := set $rule "expr" (tpl (toString $rule.expr) $) }}
        {{- end }}
        - {{ toYaml $rule | nindent 10 | trim }}
        {{- end }}
{{- end }}
