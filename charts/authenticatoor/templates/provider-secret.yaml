{{- /* Chart-managed Secret with the files providers reference (providerSecrets.files). */ -}}
{{- if and .Values.providerSecrets.files (not .Values.providerSecrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "authenticatoor.providerSecretName" . }}
  labels:
    {{- include "authenticatoor.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $name, $content := .Values.providerSecrets.files }}
  {{ $name }}: {{ $content | quote }}
{{- end }}
{{- end }}
