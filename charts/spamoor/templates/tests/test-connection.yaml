apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "spamoor.fullname" . }}-test"
  labels:
    {{- include "spamoor.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: {{ .Chart.Name }}-test
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command: ['sh', '-c', 'sleep 10']
  restartPolicy: Never