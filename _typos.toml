[default]
extend-ignore-re = [
    # Ignore Ethereum Node Records (ENR)
    "enr:-.*",
    # Ignore blutgang config typo
    "supress_rpc_check",
    # Ignore IPFS CIDs (Content Identifiers)
    "Qm[a-zA-Z0-9]{44}",
    # Ignore long base64url keys (e.g. ML-DSA public keys)
    "[A-Za-z0-9_-]{512,}",
]
